plugins {
    id("com.android.library")
    id("maven-publish")
}

android {
    namespace = 'jp.co.chlorocube.planetcolorpicker'
    compileSdk = 37
    defaultConfig {
        minSdk = 23
        targetSdk = 37
        versionCode = 12
        versionName = "1.0.12"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
        }
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

afterEvaluate {
    publishing {
        repositories {
            maven {
                name = "planetcolorpicker"
                url = uri(file("${rootDir}/repository"))
            }
        }
        publications {
            release(MavenPublication) {
                from components.release
                version = '1.0.12'
                groupId = 'jp.co.chlorocube'
                artifactId = 'planetcolorpicker'
            }
        }
    }
}

